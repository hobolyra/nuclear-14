- type: entity
  parent: BaseMachine
  id: DeployableOKPB
  name: Deployable-OKPB
  description: an Organic Kinetic Photon Barrier projector
  components:
  - type: Transform
    anchored: false
    noRot: false
  - type: Physics
    bodyType: Dynamic
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    noRot: false
    sprite: _Misfits/Objects/Misc/okpb.rsi
    layers:
    - state: retracted
      map: [ "enum.ToggleVisuals.Layer" ]
  - type: Icon
    sprite: _Misfits/Objects/Misc/okpb.rsi
    state: retracted
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleVisuals.Toggled:
        enum.ToggleVisuals.Layer:
          True: { state: deployed }
          False: { state: retracted }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.10,0.5,0.10"
        density: 190
        mask:
        - HalfWallLayer
        layer:
        - HalfWallLayer
  - type: Climbable
  - type: DeployableOkpb
  - type: ItemToggle
    onUse: false
    predictable: false
    soundActivate:
      path: /Audio/_Misfits/Effects/okpb_deploy.ogg
  - type: ComponentToggler
    components:
    - type: Reflect
      reflectProb: 0.4
      innate: true
      reflects:
      - NonEnergy
      - Energy
      - SmallCaliber
      - MediumCaliber
    - type: PowerDamAbsorption
      absorption: 0.6
  - type: PointLight
    enabled: false
    radius: 2
    energy: 1.5
    color: "#80FFFF"
    netsync: false
  - type: ItemTogglePointLight
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      machine_board: !type:Container
  - type: Construction
    graph: DeployableOKPB
    node: okpb
    containers:
    - machine_board
    - cell_slot
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        disableEject: true
        whitelist:
          components:
          - PowerCell
  - type: DoAfter
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak


- type: entity
  parent: BaseMachine
  id: DeployableOKPBFrame
  name: OKPB machine frame
  description: An unfinished barrier projector. The panel is open.
  components:
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: _Misfits/Objects/Misc/okpb.rsi
    state: open
  - type: Construction
    graph: DeployableOKPB
    node: frame
    defaultTarget: okpb
    containers:
    - machine_board
  - type: ContainerContainer
    containers:
      machine_board: !type:Container

- type: entity
  parent: BaseMachine
  id: StaticOKPBFrame
  name: experimental projectionframe
  description: an open machine frame for some unknown project
  components:
  - type: Transform
    noRot: false
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: _Misfits/Objects/Misc/okpb.rsi
    state: open